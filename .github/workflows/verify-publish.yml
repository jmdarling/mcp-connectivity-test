name: Verify and publish public image
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions: {}
concurrency:
  group: verify-publish-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1, matching shin-wallslice
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check
      - run: python3 scripts/validate-template.py
      - run: docker compose config --quiet
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - name: Build and exercise native container
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          docker buildx build --platform "linux/$ARCH" --load -t mcp-connectivity-test:verify .
          pnpm docker:smoke mcp-connectivity-test:verify "linux/$ARCH"
  publish:
    needs: verify
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Require public repository and package
        env:
          REPO: ${{ github.repository }}
        run: |
          test "$(gh api "repos/$REPO" --jq .private)" = false
          visibility=$(gh api users/jmdarling/packages/container/mcp-connectivity-test --jq .visibility)
          if [ "$visibility" != public ]; then
            printf '%s\n' 'Package visibility is still private. The owner must open this package on GitHub, select Package settings, and Change visibility to Public, then rerun this workflow. No token or wider access is needed.'
            exit 1
          fi
      - uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        id: image
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/jmdarling/mcp-connectivity-test:latest
            ghcr.io/jmdarling/mcp-connectivity-test:sha-${{ github.sha }}
          build-args: REVISION=${{ github.sha }}
          provenance: mode=max
          sbom: true
      - name: Verify public package and anonymous pulls
        env:
          DIGEST: ${{ steps.image.outputs.digest }}
        run: |
          test "$(gh api users/jmdarling/packages/container/mcp-connectivity-test --jq .visibility)" = public
          node scripts/anonymous-image.mjs "$DIGEST"
          anonymous_config=$(mktemp -d)
          trap 'rm -rf "$anonymous_config"' EXIT
          for arch in amd64 arm64; do
            docker --config "$anonymous_config" pull --platform "linux/$arch" "ghcr.io/jmdarling/mcp-connectivity-test@$DIGEST"
            test "$(docker image inspect --format '{{.Os}}/{{.Architecture}}' "ghcr.io/jmdarling/mcp-connectivity-test@$DIGEST")" = "linux/$arch"
            # The classic Docker image store cannot keep two architectures under one index digest.
            # Remove only this just-pulled reference before checking the next architecture.
            docker image rm "ghcr.io/jmdarling/mcp-connectivity-test@$DIGEST"
          done
          printf 'Public image verified with anonymous manifest access and both architecture pulls: `%s@%s`\n' ghcr.io/jmdarling/mcp-connectivity-test "$DIGEST" >> "$GITHUB_STEP_SUMMARY"
